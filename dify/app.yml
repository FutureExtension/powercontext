app:
  description: 雾隐镇夜班档案室：和 AI 搭档「阿灯」一起翻卷宗、盘镇民、破奇案。卷宗与你的调查进度都存在 seekdb 里。
  icon: 🕯️
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 雾隐镇 · 夜班档案室
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.2.5@373362a028986aae53a7baf73a7f11991ba3c22c69eaf97d6cde048cfd4a9f98
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: '雾隐镇的雨又下了一夜。你推开夜班档案室的门，桌上那盏旧灯「啪」地亮了。


      「新来的档案员？」阿灯把灯罩转了转，「卷宗都在我这儿——镇上的案子、物证、镇民的口供，一样没落。规矩就一条：你问什么我翻什么，翻到什么我记什么。」


      在下面填好你的侦探代号和要接手的案子，就可以开始提问了。

      可以这么问：「钟楼的雾钟到底是怎么坏的？」「谁把那袋灯油换掉了？」「查一下咸鱼仓的红盐账本」'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
